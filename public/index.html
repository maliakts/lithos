<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Lithos — Türkiye canlı deprem haritası</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map" aria-label="Deprem haritası"></div>

  <div class="mapctl glass" role="group" aria-label="Harita ayarları">
    <div class="seg" id="segBase" role="radiogroup" aria-label="Harita türü">
      <button role="radio" data-v="sat" aria-checked="true">Uydu</button>
      <button role="radio" data-v="terrain" aria-checked="false">Arazi</button>
      <button role="radio" data-v="dark" aria-checked="false">Koyu</button>
      <button role="radio" data-v="light" aria-checked="false">Açık</button>
    </div>
    <button class="toggle" id="plates" aria-pressed="false" title="Tektonik levha sınırları (PB2002)">Levha sınırları</button>
  </div>

  <aside id="panel" class="glass" aria-label="Depremler">
    <div class="grabber" id="grabber" aria-hidden="true"><span></span></div>
    <header id="head">
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="logo.png" alt="" width="46" height="46" /></div>
        <div class="title"><h1>Lithos</h1><p>Türkiye canlı deprem haritası</p></div>
        <span class="live" id="live" role="status">Bağlanıyor…</span>
      </div>
      <div id="chips" class="chips" aria-live="polite"></div>
    </header>

    <a id="tg" class="tg" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21.5 4.3 2.9 11.5c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.8.8.5 0 .7-.2 1-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8L22.9 5.9c.3-1.2-.4-1.8-1.4-1.6zM9 13.8l9.4-5.9c.4-.3.8-.1.5.2l-7.8 7-.3 3.3L9 13.8z"/></svg><span><b>Anlık bildirimler Telegram’da</b><small>Yeni depremler kanala otomatik düşer</small></span><i aria-hidden="true">›</i></a>
    <div id="stats" class="stats" aria-live="polite"></div>
    <div id="spark" class="spark" aria-hidden="true"></div>
    <div class="sparkax" aria-hidden="true"><span id="axL"></span><span>şimdi</span></div>

    <div class="controls">
      <label class="search"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="İl veya ilçe ara" autocomplete="off" spellcheck="false" aria-label="İl veya ilçe ara" /></label>
      <div class="rowseg">
      <div class="seg" id="segTime" role="radiogroup" aria-label="Zaman aralığı">
        <button role="radio" data-v="1" aria-checked="false">1 sa</button>
        <button role="radio" data-v="6" aria-checked="false">6 sa</button>
        <button role="radio" data-v="24" aria-checked="true">24 sa</button>
      </div>
      <div class="seg" id="segMag" role="radiogroup" aria-label="Minimum büyüklük">
        <button role="radio" data-v="0" aria-checked="true">Tümü</button>
        <button role="radio" data-v="2" aria-checked="false">2+</button>
        <button role="radio" data-v="3" aria-checked="false">3+</button>
        <button role="radio" data-v="4" aria-checked="false">4+</button>
        <button role="radio" data-v="5" aria-checked="false">5+</button>
      </div>
      </div>
    </div>

    <div class="views">
      <ul id="list" class="list"></ul>
      <section id="detail" class="detail" hidden></section>
    </div>
  </aside>

  <div class="legend glass" aria-label="Büyüklük renkleri">
    <span><i style="background:#30d158"></i>&lt;3</span><span><i style="background:#ffd60a"></i>3–4</span><span><i style="background:#ff9f0a"></i>4–5</span><span><i style="background:#ff453a"></i>5+</span>
  </div>

  <div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
