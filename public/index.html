<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Lithos — Türkiye canlı deprem haritası</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map" aria-label="Deprem haritası"></div>

  <div class="mapctl glass" role="group" aria-label="Harita ayarları">
    <div class="seg" id="segBase" role="radiogroup" aria-label="Harita türü">
      <button role="radio" data-v="sat" aria-checked="true">Uydu</button>
      <button role="radio" data-v="dark" aria-checked="false">Koyu</button>
      <button role="radio" data-v="light" aria-checked="false">Açık</button>
    </div>
    <button class="toggle" id="plates" aria-pressed="false" title="Tektonik levha sınırları (PB2002)">Levha sınırları</button>
  </div>

  <aside id="panel" class="glass" aria-label="Depremler">
    <div class="grabber" id="grabber" aria-hidden="true"><span></span></div>
    <header id="head">
      <div class="brand">
        <h1>Lithos</h1>
        <span class="live" id="live" role="status">Bağlanıyor…</span>
      </div>
      <div id="chips" class="chips" aria-live="polite"></div>
    </header>

    <div class="controls">
      <div class="seg" id="segTime" role="radiogroup" aria-label="Zaman aralığı">
        <button role="radio" data-v="1" aria-checked="false">1 sa</button>
        <button role="radio" data-v="6" aria-checked="false">6 sa</button>
        <button role="radio" data-v="24" aria-checked="true">24 sa</button>
      </div>
      <div class="seg" id="segMag" role="radiogroup" aria-label="Minimum büyüklük">
        <button role="radio" data-v="0" aria-checked="true">Tümü</button>
        <button role="radio" data-v="2" aria-checked="false">2+</button>
        <button role="radio" data-v="3" aria-checked="false">3+</button>
        <button role="radio" data-v="4" aria-checked="false">4+</button>
        <button role="radio" data-v="5" aria-checked="false">5+</button>
      </div>
    </div>

    <div class="views">
      <ul id="list" class="list"></ul>
      <section id="detail" class="detail" hidden></section>
    </div>
  </aside>

  <div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
